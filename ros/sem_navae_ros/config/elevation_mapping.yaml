# Robot.
map_frame_id:                               base_link
robot_base_frame_id:                        base_link
robot_pose_with_covariance_topic:           /odom_pose
robot_pose_cache_size:                      10
input_sources:
  front: # A name to identify the input source
    type: pointcloud
    topic: /ouster/points
    queue_size: 100
    publish_on_update: true # Wheter to publish the elevation map after a callback from this source.
    sensor_processor:
      type: perfect
      ignore_points_above:       1.5

track_point_frame_id:                       base_link
track_point_x:                              9.0
track_point_y:                              0.0
track_point_z:                              0.0
min_update_rate:                            3.0
time_tolerance:                             1.0
time_offset_for_point_cloud:                0.0
# sensor_processor/ignore_points_below:       1

robot_motion_map_update/covariance_scale:   0.01

# Map.
length_in_x:                                18.0
length_in_y:                                18.0
position_x:                                 9.0
position_y:                                 0.0
resolution:                                 0.1
min_variance:                               0.0001
max_variance:                               0.05
mahalanobis_distance_threshold:             2.5
multi_height_noise:                         0.001
surface_normal_positive_axis:               z
fused_map_publishing_rate:                  5
enable_visibility_cleanup:                  true
visibility_cleanup_rate:                    5.0
scanning_duration:                          .20 # two full scans
enable_continuous_cleanup:                  true

# Init submap
# initialize_elevation_map:                   true
# initialization_method:                      0
# length_in_x_init_submap:                    1.6
# length_in_y_init_submap:                    1.6
# init_submap_height_offset:                  0.01
# init_submap_variance:                       0.001
